<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        <!--normal fcn-->
        function human(a, b) {
            return a + b;
        }
        console.log(human(25, 25));
        <!--Arrow-->
        const other = (one, two) => {
            return one + two;
        }
        console.log(other(100, 200));

        <!--Class with Constructor and Method-->
        
        class Student {

            constructor(name, age) {
                this.name = name;
                this.age = age;
            }

            sayHello() {
                console.log("Hello " + this.name);
            }
        }

        const student1 = new Student("akash", 20);

        console.log(student1.name);
        console.log(student1.age);

        student1.sayHello();
    </script>
</body>

</html>
